<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCCOER Student Support Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1a3a5c;
  --primary-light: #2563a8;
  --accent: #f97316;
  --accent-soft: #fff7ed;
  --sidebar-bg: #0f2540;
  --sidebar-width: 265px;
  --topbar-h: 64px;
  --card-radius: 14px;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --bg-main: #f0f4f8;
  --text-main: #1e293b;
  --text-muted: #64748b;
  --card-bg: #ffffff;
  --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); }

/* ── AUTH ── */
#authScreen {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2540 0%, #1a3a5c 40%, #2563a8 100%);
  display: flex; align-items: center; justify-content: center;
}
.auth-card {
  background: white; border-radius: 24px; padding: 48px 40px;
  width: 420px; box-shadow: 0 32px 80px rgba(0,0,0,0.3);
}
.auth-logo { width: 60px; height: 60px; background: var(--primary); border-radius: 14px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.auth-logo i { color: white; font-size: 26px; }
.auth-card h2 { text-align: center; font-weight: 800; color: var(--primary); font-size: 1.6rem; }
.auth-card p.sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }
.auth-card .form-control { border-radius: 10px; padding: 12px 16px; border: 1.5px solid #e2e8f0;
  font-size: 0.9rem; transition: border 0.2s; }
.auth-card .form-control:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(37,99,168,0.1); }
.auth-card label { font-weight: 600; font-size: 0.85rem; color: var(--text-main); margin-bottom: 6px; }
.btn-login { background: var(--primary); color: white; border: none; border-radius: 10px;
  padding: 12px; font-weight: 700; font-size: 0.95rem; width: 100%; transition: 0.2s;
  letter-spacing: 0.3px; }
.btn-login:hover { background: var(--primary-light); transform: translateY(-1px); }
.role-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.role-tab { flex: 1; padding: 8px 4px; border: 1.5px solid #e2e8f0; border-radius: 8px;
  text-align: center; font-size: 0.72rem; font-weight: 600; cursor: pointer; color: var(--text-muted);
  transition: 0.2s; }
.role-tab.active { border-color: var(--primary); background: var(--primary); color: white; }
.demo-creds { background: #f8fafc; border-radius: 10px; padding: 12px; margin-top: 16px;
  font-size: 0.78rem; color: var(--text-muted); text-align: center; }
.demo-creds strong { color: var(--primary); }

/* ── LAYOUT ── */
#appScreen { display: none; }
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width);
  background: var(--sidebar-bg); z-index: 100; display: flex; flex-direction: column;
  transition: transform 0.3s;
}
.sidebar-brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-logo { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 38px; height: 38px; background: var(--accent); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.brand-icon i { color: white; font-size: 16px; }
.brand-text { color: white; }
.brand-text .name { font-size: 0.78rem; font-weight: 800; line-height: 1.2; letter-spacing: 0.3px; }
.brand-text .college { font-size: 0.65rem; color: rgba(255,255,255,0.45); font-weight: 400; }
.college-logo{
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  background: white;
  padding: 2px;
  border: 2px solid rgba(255,255,255,0.2);
}
.sidebar-user { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px; }
.avatar-sm { width: 34px; height: 34px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.user-info .u-name { color: white; font-size: 0.8rem; font-weight: 600; }
.user-info .u-role { color: rgba(255,255,255,0.45); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.nav-section { padding: 8px 20px 4px; color: rgba(255,255,255,0.3); font-size: 0.63rem;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  color: rgba(255,255,255,0.55); font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: 0.15s; border-left: 3px solid transparent; text-decoration: none; }
.nav-item:hover { color: white; background: rgba(255,255,255,0.06); }
.nav-item.active { color: white; background: rgba(255,255,255,0.1); border-left-color: var(--accent); }
.nav-item i { width: 18px; text-align: center; font-size: 0.88rem; }
.nav-badge { margin-left: auto; background: var(--accent); color: white; border-radius: 12px;
  font-size: 0.65rem; font-weight: 700; padding: 2px 7px; }

.main-wrap { margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: var(--topbar-h); background: white; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 28px; gap: 16px; position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: white; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); font-size: 14px; transition: 0.15s; position: relative; }
.icon-btn:hover { background: var(--bg-main); color: var(--primary); }
.notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
  background: var(--accent); border-radius: 50%; border: 1.5px solid white; }
.avatar-top { width: 36px; height: 36px; border-radius: 50%; background: var(--primary);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; cursor: pointer; }
.page-content { flex: 1; padding: 28px; }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 1.5rem; font-weight: 800; }
.page-header p { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }

/* Cards */
.card { border-radius: var(--card-radius); border: 1px solid var(--border); background: var(--card-bg); }
.card-header-custom { padding: 18px 20px 0; }
.card-title { font-size: 0.95rem; font-weight: 700; }
.card-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

.stat-card { border-radius: var(--card-radius); padding: 20px; border: 1px solid var(--border);
  background: white; }
.stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; margin-bottom: 14px; }
.stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1; }
.stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; font-weight: 500; }
.stat-delta { font-size: 0.73rem; font-weight: 600; margin-top: 8px; }
.stat-delta.up { color: var(--success); }
.stat-delta.down { color: var(--danger); }
.icon-blue { background: #dbeafe; color: #1d4ed8; }
.icon-green { background: #dcfce7; color: #15803d; }
.icon-amber { background: #fef3c7; color: #b45309; }
.icon-red { background: #fee2e2; color: #dc2626; }
.icon-purple { background: #ede9fe; color: #7c3aed; }
.icon-orange { background: #ffedd5; color: #c2410c; }

/* Badges */
.badge-status { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
.badge-open { background: #fef3c7; color: #b45309; }
.badge-progress { background: #dbeafe; color: #1d4ed8; }
.badge-resolved { background: #dcfce7; color: #15803d; }
.badge-closed { background: #f1f5f9; color: #64748b; }
.badge-pending { background: #ede9fe; color: #7c3aed; }

/* Table */
.table-custom { font-size: 0.82rem; }
.table-custom th { font-weight: 600; color: var(--text-muted); font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.5px; background: #f8fafc; }
.table-custom td { vertical-align: middle; color: var(--text-main); }

/* Forms */
.form-label-custom { font-size: 0.82rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
.form-control-custom { border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 14px;
  font-size: 0.85rem; width: 100%; outline: none; transition: border 0.2s; background: white; color: var(--text-main); }
.form-control-custom:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(37,99,168,0.08); }
.form-select-custom { border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 14px;
  font-size: 0.85rem; width: 100%; outline: none; transition: border 0.2s; background: white;
  color: var(--text-main); appearance: none; cursor: pointer; }
.btn-primary-custom { background: var(--primary); color: white; border: none; border-radius: 8px;
  padding: 10px 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-primary-custom:hover { background: var(--primary-light); }
.btn-outline-custom { background: white; color: var(--primary); border: 1.5px solid var(--primary);
  border-radius: 8px; padding: 10px 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-outline-custom:hover { background: var(--primary); color: white; }
.btn-accent { background: var(--accent); color: white; border: none; border-radius: 8px;
  padding: 10px 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-accent:hover { background: #ea6c05; }

/* Complaints */
.complaint-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: white;
  transition: 0.2s; margin-bottom: 12px; }
.complaint-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }
.c-cat { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.c-title { font-size: 0.9rem; font-weight: 700; margin: 4px 0; }
.c-meta { font-size: 0.75rem; color: var(--text-muted); }

/* Events */
.event-card { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: white; }
.event-banner { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
.event-body { padding: 16px; }
.event-title { font-size: 0.92rem; font-weight: 700; }
.event-date { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
.event-tag { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; margin-top: 8px; }

/* Mentor */
.mentor-card { border-radius: 14px; border: 1px solid var(--border); padding: 20px; background: white; text-align: center; }
.mentor-avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: white; }
.mentor-name { font-size: 0.9rem; font-weight: 700; }
.mentor-role { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }
.mentor-skills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 10px; }
.skill-tag { padding: 3px 8px; background: #f1f5f9; border-radius: 20px; font-size: 0.68rem; font-weight: 600; color: var(--text-muted); }

/* Notif */
.notif-item { padding: 14px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 12px; }
.notif-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-shrink: 0; }
.notif-body .n-title { font-size: 0.83rem; font-weight: 600; }
.notif-body .n-time { font-size: 0.73rem; color: var(--text-muted); margin-top: 3px; }
.notif-body .n-msg { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
.notif-item.unread { background: #f8fafc; }

/* Library */
.book-card { border-radius: 12px; border: 1px solid var(--border); padding: 16px; background: white; }
.book-cover { width: 48px; height: 64px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 20px; margin-right: 14px; flex-shrink: 0; }
.book-title { font-size: 0.88rem; font-weight: 700; }
.book-author { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
.book-avail { font-size: 0.72rem; font-weight: 600; margin-top: 6px; }

/* Facilities */
.facility-card { border-radius: 14px; border: 1px solid var(--border); padding: 20px; background: white; }
.facility-icon { font-size: 2rem; margin-bottom: 10px; }
.facility-name { font-size: 0.92rem; font-weight: 700; }
.facility-detail { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

/* Chart containers */
.chart-wrap { position: relative; height: 260px; }

/* Breadcrumb */
.breadcrumb-custom { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
.breadcrumb-custom span { color: var(--primary); font-weight: 600; }

/* Toast */
.toast-container-custom { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast-item { background: #1e293b; color: white; padding: 12px 18px; border-radius: 10px;
  font-size: 0.82rem; font-weight: 500; display: flex; align-items: center; gap: 8px;
  animation: slideIn 0.3s; box-shadow: 0 8px 24px rgba(0,0,0,0.2); min-width: 260px; }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-item i { color: var(--accent); font-size: 14px; }

/* Suggest modal */
.suggestion-form { background: white; border-radius: 14px; padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; }

/* Progress */
.progress-custom { height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
.progress-bar-custom { height: 100%; border-radius: 99px; background: var(--primary-light); }

/* Admin table actions */
.tbl-action { padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: none; transition: 0.15s; }
.tbl-resolve { background: #dcfce7; color: #15803d; }
.tbl-view { background: #dbeafe; color: #1d4ed8; }
.tbl-delete { background: #fee2e2; color: #dc2626; }

/* Mobile sidebar toggle */
.sidebar-toggle { display: none; }
@media (max-width: 768px) {
  .sidebar-toggle { display: flex; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-wrap { margin-left: 0; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

/* Forum */
.forum-post { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: white; margin-bottom: 10px; }
.forum-post .fp-user { font-size: 0.78rem; font-weight: 700; color: var(--primary); }
.forum-post .fp-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
.forum-post .fp-body { font-size: 0.83rem; margin-top: 8px; line-height: 1.5; }
.forum-post .fp-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; display: flex; gap: 16px; }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 20px 0; }

/* Profile */
.profile-cover { height: 120px; border-radius: 14px 14px 0 0; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--accent);
  color: white; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  border: 4px solid white; margin-top: -40px; margin-left: 24px; }
.profile-info { padding: 8px 24px 24px; }
.profile-name { font-size: 1.15rem; font-weight: 800; }
.profile-role-badge { display: inline-block; padding: 3px 10px; border-radius: 20px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; font-weight: 700; margin-left: 8px; }

</style>
</head>

<!-- ══════════════════════════════════ AUTH ══════════════════════════════════ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><i class="fas fa-graduation-cap"></i></div>

      <input type="password" id="loginPass" class="form-control" placeholder="••••••••" value="demo123">

    <div class="demo-creds">
      <strong>Demo Mode</strong> — Enter any credentials. Select your role above to explore different dashboards.
    </div>
  </div>
</div>

<!-- ══════════════════════════════════ APP ══════════════════════════════════ -->
<div id="appScreen">
  <!-- SIDEBAR -->

<script>

const DEMO_USERS = {

};

const NAV_ITEMS = {
  student: [
    { section: 'Main' },
    { id: 'dashboard', label: 'Dashboard', icon: 'fa-gauge-high' },

// ══════════════════ AUTH ══════════════════
function selectRole(el) {
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentRole = el.dataset.role;
}

function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  if (!id) { showToast('Please enter your College ID', 'warning'); return; }
  currentUser = DEMO_USERS[currentRole];
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  initApp();
}

// ══════════════════ APP INIT ══════════════════
function initApp() {
  document.getElementById('sidebarAvatar').textContent = currentUser.initials;
  document.getElementById('sidebarName').textContent = currentUser.name.split(' ')[0] + ' ' + currentUser.name.split(' ')[1][0] + '.';
  document.getElementById('sidebarRole').textContent = currentRole.charAt(0).toUpperCase() + currentRole.slice(1);
  document.getElementById('topAvatar').textContent = currentUser.initials;
  buildNav();
  showPage('dashboard');
}

function buildNav() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  const items = NAV_ITEMS[currentRole] || NAV_ITEMS.student;
  items.forEach(item => {
    if (item.section) {
      nav.innerHTML += `<div class="nav-section">${item.section}</div>`;
    } else {
      nav.innerHTML += `<div class="nav-item" id="nav-${item.id}" onclick="showPage('${item.id}')">
        <i class="fas ${item.icon}"></i> ${item.label}
        ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
      </div>`;
    }
  });
}

function showPage(id) {
  currentPage = id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + id);
  if (navEl) navEl.classList.add('active');

  const titles = {
    dashboard: 'Dashboard', profile: 'My Profile', complaints: 'Complaints & Grievances',
    suggestions: 'Suggestions', mentors: 'Mentors & Alumni', forum: 'Discussion Forum',
    events: 'Events & Hackathons', facilities: 'Campus Facilities', library: 'Library',
    notifications: 'Notifications', 'admin-users': 'Manage Users'
  };
  document.getElementById('topbarTitle').textContent = titles[id] || 'Dashboard';
  const content = document.getElementById('pageContent');

  const renders = {
    dashboard: renderDashboard,
    profile: renderProfile,
    complaints: renderComplaints,
    suggestions: renderSuggestions,
    mentors: renderMentors,
    forum: renderForum,
    events: renderEvents,
    facilities: renderFacilities,
    library: renderLibrary,
    notifications: renderNotifications,
    'admin-users': renderAdminUsers,
  };
  content.innerHTML = (renders[id] || renderDashboard)();
  setTimeout(initCharts, 50);
}

function initCharts() {
  const c1 = document.getElementById('chart1');
  const c2 = document.getElementById('chart2');
  if (!c1) return;

  const p = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };

  if (currentRole === 'admin') {
    new Chart(c1, { type: 'bar', data: {
      labels: ['Jan','Feb','Mar','Apr','May'],
      datasets: [
        { label:'Received', data:[18,24,15,28,12], backgroundColor:'#3b82f6', borderRadius:6 },
        { label:'Resolved', data:[12,20,14,22,8], backgroundColor:'#10b981', borderRadius:6 },
      ]
    }, options: { ...p, plugins: { legend: { display: true } } } });
    if (c2) new Chart(c2, { type: 'doughnut', data: {
      labels: ['Students','Faculty','Alumni','Admin'],
      datasets: [{ data:[980,120,110,38], backgroundColor:['#3b82f6','#10b981','#f59e0b','#8b5cf6'], borderWidth:0 }]
    }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom' } } } });
  } else if (currentRole === 'alumni') {
    new Chart(c1, { type: 'line', data: {
      labels: ['Jan','Feb','Mar','Apr','May'],
      datasets: [{ label:'Sessions', data:[1,2,1,3,2], borderColor:'#7c3aed', tension:0.4, fill:true, backgroundColor:'rgba(124,58,237,0.1)' }]
    }, options: p });
  } else {
    new Chart(c1, { type: 'bar', data: {
      labels: ['Jan','Feb','Mar','Apr','May'],
      datasets: [{ label:'Complaints', data:[2,1,3,2,1], backgroundColor:'#3b82f6', borderRadius:6 }]
    }, options: p });
    if (c2) new Chart(c2, { type: 'doughnut', data: {
      labels: ['Open','Progress','Resolved','Closed'],
      datasets: [{ data:[2,1,1,1], backgroundColor:['#f59e0b','#3b82f6','#10b981','#94a3b8'], borderWidth:0 }]
    }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom' } } } });
  }
}

function showToast(msg, type='info') {
  const colors = { success:'#10b981', info:'#3b82f6', warning:'#f59e0b', error:'#ef4444' };
  const icons = { success:'fa-check-circle', info:'fa-info-circle', warning:'fa-exclamation-circle', error:'fa-times-circle' };
  const tc = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast-item';
  t.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]}"></i>${msg}`;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
